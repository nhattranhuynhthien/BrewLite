name: BrewLite CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-backend:
    name: Build Backend (NestJS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: brewlite_test
          POSTGRES_PASSWORD: brewlite_test
          POSTGRES_DB: brewlite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brewlite_test -d brewlite_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://brewlite_test:brewlite_test@127.0.0.1:5432/brewlite_test?schema=public&connection_limit=5
    defaults:
      run:
        working-directory: ./apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ./apps/api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build Backend
        run: npm run build
      - name: Lint Backend
        run: npm run lint
      - name: Unit tests
        run: npm test -- --runInBand
      - name: Apply test migrations
        run: npm run test:e2e:migrate
      - name: Integration tests
        run: npm run test:e2e

  build-frontend:
    name: Build Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ./apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build Frontend
        run: npm run build
      - name: Lint Frontend
        run: npm run lint
      - name: Frontend regressions
        run: npm test
